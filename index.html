<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loginScreen" class="screen">
  <div class="login-box">
    <div class="lock">🔐</div>
    <h1>Private Vault</h1>
    <p>Shaxsiy parollar ombori</p>

    <input
      type="password"
      id="masterPassword"
      placeholder="Master password"
      autocomplete="off"
    >

    <button id="loginBtn">Kirish</button>

    <p id="loginMessage"></p>
  </div>
</div>


<div id="app" class="app hidden">

  <header>
    <div>
      <h1>🔐 Private Vault</h1>
      <span>Shaxsiy ma'lumotlaringiz</span>
    </div>

    <button id="logoutBtn" class="logout">Chiqish</button>
  </header>


  <main>

    <div class="top">
      <div>
        <h2>Mening akkauntlarim</h2>
        <p>Login va parollarni xavfsiz saqlash</p>
      </div>

      <button id="addBtn" class="add">＋ Qo‘shish</button>
    </div>


    <div id="empty" class="empty">
      <div>🔒</div>
      <h3>Hali akkaunt qo‘shilmagan</h3>
      <p>“Qo‘shish” tugmasi orqali birinchi akkauntingizni kiriting.</p>
    </div>


    <div id="vault" class="vault"></div>

  </main>
</div>


<div id="modal" class="modal hidden">

  <div class="modal-box">

    <button id="closeModal" class="close">×</button>

    <h2 id="modalTitle">Akkaunt qo‘shish</h2>

    <label>Platforma</label>

    <input
      id="site"
      type="text"
      placeholder="Instagram, TikTok, Facebook..."
    >

    <label>Login / Username</label>

    <input
      id="username"
      type="text"
      placeholder="@username yoki email"
      autocomplete="off"
    >

    <label>Parol</label>

    <div class="password-input">
      <input
        id="password"
        type="password"
        placeholder="Parol"
        autocomplete="new-password"
      >
      <button id="showPassword" type="button">👁</button>
    </div>

    <label>Izoh</label>

    <textarea
      id="note"
      placeholder="Qo‘shimcha ma'lumot..."
    ></textarea>

    <button id="saveBtn" class="save">Saqlash</button>

  </div>
</div>


<script src="script.js"></script>

</body>
</html>
